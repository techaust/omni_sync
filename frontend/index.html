<!doctype html>
<!-- The server renders this file per request: __THEME_CLASS__ becomes "light", "dark" or "" (system)
     and __CSP_NONCE__ becomes the per-request nonce (backend/src/omnisync/api/spa.py). -->
<html lang="en" class="__THEME_CLASS__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta property="csp-nonce" content="__CSP_NONCE__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OmniSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

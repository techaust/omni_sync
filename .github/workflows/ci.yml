# Quality gates from docs/09-TESTING-STRATEGY.md section 10 and CONTRIBUTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Documentation checker self-tests
        run: python -m unittest scripts/test_check_docs.py -v
      - name: Check docs (links, IDs, traceability, diagrams)
        # The legacy repository is not available in CI: its citations are reported as warnings.
        run: python scripts/check_docs.py
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: ruff (lint)
        run: uv run ruff check src tests scripts
      - name: ruff (format)
        run: uv run ruff format --check src tests scripts
      - name: mypy --strict
        run: uv run python -m mypy
      - name: Architecture layers (import-linter)
        run: uv run python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"
      - name: Tests with coverage gate
        run: uv run python -m pytest
      - name: Dependency audit
        if: matrix.os == 'ubuntu-24.04'
        run: uv run pip-audit --skip-editable

  frontend:
    name: Front end
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit tests with coverage gate (includes WCAG token contrast)
        run: npm run test:coverage
      - name: API types match the backend OpenAPI schema
        run: npm run api:check
      - run: npm run build
      - name: Bundle budget (NFR-PERF-02)
        run: npm run check:bundle
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project ../backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
